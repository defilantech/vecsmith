apiVersion: apps/v1
kind: Deployment
metadata:
  name: vecsmith-frontend
  namespace: vecsmith
  labels:
    app.kubernetes.io/name: vecsmith-frontend
    app.kubernetes.io/part-of: vecsmith
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vecsmith-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vecsmith-frontend
        app.kubernetes.io/part-of: vecsmith
    spec:
      containers:
        - name: frontend
          # TODO: Replace with your registry
          image: your-registry/vecsmith/frontend:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: VECSMITH_API_URL
              value: "http://vecsmith-orchestrator.vecsmith.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
