apiVersion: apps/v1
kind: Deployment
metadata:
  name: vecsmith-flux-server
  namespace: vecsmith
  labels:
    app.kubernetes.io/name: vecsmith-flux-server
    app.kubernetes.io/part-of: vecsmith
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vecsmith-flux-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vecsmith-flux-server
        app.kubernetes.io/part-of: vecsmith
    spec:
      containers:
        - name: flux-server
          # TODO: Replace with your registry
          image: your-registry/vecsmith/flux-server:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: FLUX_HOST
              value: "0.0.0.0"
            - name: FLUX_PORT
              value: "8081"
            - name: HF_HOME
              value: "/models/flux"
            - name: FLUX_QUANTIZE_FP8
              value: "true"
            # Optional: HuggingFace token for gated models
            # - name: HF_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: hf-token
            #       key: token
          resources:
            requests:
              cpu: "2"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models/flux
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 180
            periodSeconds: 30
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: flux-model-cache
